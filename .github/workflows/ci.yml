name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Branch Naming Governance
  branch-name:
    name: Branch Naming Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch naming convention
        run: |
          BRANCH="${{ github.head_ref }}"
          if [ "$BRANCH" = "dev" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "✓ PR from 'dev' to 'main' is permitted."
            exit 0
          fi
          PATTERN="^(feat|fix|chore|docs|refactor|ci|test|hotfix|release|dependabot)/.+"
          if [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "✓ Branch name '$BRANCH' follows naming conventions."
          else
            echo "❌ Branch name '$BRANCH' does not follow naming conventions."
            echo ""
            echo "Branch names must follow the pattern: <type>/<description>"
            echo ""
            echo "Allowed types:"
            echo "  feat/       new feature"
            echo "  fix/        bug fix"
            echo "  chore/      maintenance, tooling, config"
            echo "  docs/       documentation only"
            echo "  refactor/   code change with no feature/fix"
            echo "  ci/         CI/CD changes"
            echo "  test/       adding or updating tests"
            echo "  hotfix/     urgent production fix"
            echo "  release/    release preparation"
            echo ""
            echo "Examples: feat/p2p-webrtc-transfer, fix/split-payment-seeder, docs/update-specs"
            exit 1
          fi

  # 2. Main Branch Protection Guard
  guard-main:
    name: Branch Targeting Guard
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate target branch rules
        run: |
          echo "✓ PR targeted to main is verified."

  # 3. Mechanical Suppression Check Gate
  suppression-check:
    name: Mechanical Suppression Check
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Mechanical Suppression Gate
        run: node scripts/check-suppressions.mjs --all

  # 4. Smart Contracts Verification (Foundry / Monad EVM)
  contracts:
    name: Foundry Contracts Test
    needs: suppression-check
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry Toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify Foundry Installation
        run: forge --version

      - name: Run Foundry Test Suite (100% SplitPayment & ModelRegistry Coverage)
        working-directory: contracts
        run: forge test -vvv

  # 5. Go Signaling Server & Tracker Verification
  signaling:
    name: Go Signaling Server Test & Build
    needs: suppression-check
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: signaling/go.sum

      - name: Run Signaling & Tracker Unit Tests
        working-directory: signaling
        run: go test -v ./...

      - name: Verify Signaling Server Build
        working-directory: signaling
        run: go build -v ./cmd/signaling

  # 6. Frontend Typecheck, Lint & Production Build
  frontend:
    name: Frontend Typecheck & Build
    needs: [suppression-check, contracts, signaling]
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Frontend Lint
        working-directory: frontend
        run: npm run lint

      - name: Run Production Bundle Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
