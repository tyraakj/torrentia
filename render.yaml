services:
  - type: web
    name: torrentia-backend
    env: docker
    dockerfilePath: signaling/Dockerfile.combined
    dockerContext: signaling
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: AUTH_REQUIRED
        value: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PINATA_JWT
        sync: false




