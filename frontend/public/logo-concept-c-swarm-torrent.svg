<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- Concept C: The Swarm Torrent (Fluid Kinetic Chutes)
       Twin fluid laminar streams sweeping from the outer wings and cascading down 
       into an accelerated central torrent with 45° jet terminals.
       Represents: Torrential data streams, dual-channel P2P bandwidth aggregation.
       100% naked vector. Zero gradients, zero noise. Works in flat black, white, or brand blue. -->

  <!-- Left Chute -->
  <path 
    d="
      M 16 18
      H 36
      A 12 12 0 0 1 48 30
      V 90
      L 34 78
      V 42
      A 8 8 0 0 1 26 34
      H 16
      Z
    " 
    fill="#0062FF" 
  />

  <!-- Right Chute (Mirrored with a 4px central velocity channel) -->
  <path 
    d="
      M 84 18
      H 64
      A 12 12 0 0 0 52 30
      V 90
      L 66 78
      V 42
      A 8 8 0 0 0 74 34
      H 84
      Z
    " 
    fill="#0062FF" 
  />
</svg>
